name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Generate data (scale 0.1)
        # Writes the ground truth to runs/ so the committed full-scale file is untouched.
        run: uv run paysight data generate --scale 0.1 --ground-truth runs/ci_ground_truth.yaml

      - name: Tests
        run: uv run pytest -q
