# Paysight global settings. Every threshold used by code lives here, not in the code.

data:
  start_date: 2026-08-01          # first transaction date, inclusive
  end_date: 2026-10-31            # last transaction date, inclusive
  as_of_date: 2026-10-31          # "today" for all relative dates (end of day); never the wall clock
  seed: 42
  default_scale: 1.0
  duckdb_path: data/paysight.duckdb
  ground_truth_path: data/ground_truth.yaml

limits:
  query_timeout_s: 10             # execution guard: con.interrupt() after this many seconds
  default_row_limit: 10000        # injected when a query has no LIMIT; larger limits are capped
  max_time_window_days: 400       # maximum created_at span for queries over attempt/order views
  max_joins: 4
  max_estimated_rows: 50000000    # EXPLAIN cardinality guard
  cache_max_entries: 256          # in-memory query result cache (LRU)

analysis:
  alpha: 0.05                     # significance level before multiple-testing correction
  practical_significance_pp: 0.5  # |delta| in pp needed for a change to be practically significant
  min_sample_attempts: 1000       # each window needs at least this many attempts
  min_delta_for_shares_pp: 0.1    # below this |delta|, mix/rate shares are unstable: report absolutes only
  denominator_divergence_pp: 1.0  # show a sensitivity note when SR definitions differ by this much
  anomaly_z_threshold: 3.5        # robust z-score (median/MAD) threshold
  reconcile_unexplained_flag_pct: 0.5  # flag unexplained reconciliation residuals at or above this %

llm:
  default_provider: anthropic     # overridden by LLM_PROVIDER
  # Default model per provider (overridden by LLM_MODEL). Model names live only here and in
  # .env.example.
  models:
    gemini: gemini-3.8-flash
    anthropic: claude-sonnet-5-5
    openai: gpt-5-mini
  temperature: 0.0
  max_attempts: 4                 # tenacity: retries on 429 / 5xx / timeouts, with jittered backoff
  request_timeout_s: 60
  cassette_dir: cassettes
  budget_usd: 4.0                 # hard stop on cumulative live spend (recording + eval)
  spend_ledger: runs/llm_spend.json
  # USD per 1M tokens, keyed by model. Source: platform.claude.com/docs/en/about-claude/pricing
  # (checked 2026-11-21). Gemini was used on the free tier. Unknown models count as $0.
  prices_per_million_tokens:
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.10}
    claude-haiku-5-5: {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01}
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}
    gemini-3.8-flash: {input: 0.0, output: 0.0}
