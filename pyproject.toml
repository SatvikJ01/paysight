[project]
name = "paysight"
version = "0.1.0"
description = "An AI payments analyst that shows its work and catches the traps naive AI falls into."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "sqlglot>=25.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "streamlit>=1.38",
    "plotly>=5.22",
    "typer>=0.12",
    "tenacity>=8.5",
    "python-dotenv>=1.0",
    # LLM SDKs: installed by default, imported lazily, and selected at runtime by LLM_PROVIDER.
    "google-genai>=1.0",
    "anthropic>=0.40",
    "openai>=1.50",
]

[project.scripts]
paysight = "paysight.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paysight"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["cassettes", "runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow ₹, ×, − and similar characters in text

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that build a dataset or run the full pipeline",
]
